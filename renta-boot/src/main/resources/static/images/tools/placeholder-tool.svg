<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)" />
  <rect width="400" height="300" fill="url(#grid)" />

  <!-- Industrial Frame / Border -->
  <rect x="15" y="15" width="370" height="270" rx="12" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 6" />

  <!-- Heavy Machinery / Construction Tool Silhouette Icon -->
  <g transform="translate(150, 85)">
    <!-- Shield / Machine Base -->
    <rect x="0" y="40" width="100" height="35" rx="8" fill="#334155" />
    <!-- Tracks / Wheels -->
    <rect x="-10" y="70" width="120" height="18" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <circle cx="5" cy="79" r="5" fill="#f59e0b" />
    <circle cx="28" cy="79" r="5" fill="#f59e0b" />
    <circle cx="50" cy="79" r="5" fill="#f59e0b" />
    <circle cx="72" cy="79" r="5" fill="#f59e0b" />
    <circle cx="95" cy="79" r="5" fill="#f59e0b" />
    <!-- Cabin / Body -->
    <path d="M 15 40 L 30 10 L 70 10 L 80 40 Z" fill="url(#accentGrad)" />
    <!-- Window -->
    <polygon points="35,16 65,16 60,35 25,35" fill="#0f172a" />
    <!-- Crane Arm / Boom -->
    <path d="M 75 25 L 115 -10 L 122 -5 L 85 30 Z" fill="#94a3b8" />
    <path d="M 115 -10 L 130 15" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <circle cx="130" cy="18" r="4" fill="#f59e0b" />
  </g>

  <!-- Text Badge -->
  <g transform="translate(200, 225)" text-anchor="middle">
    <rect x="-90" y="-14" width="180" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#f59e0b" letter-spacing="1.5">
      RENTAMAQ INDUSTRIAL
    </text>
  </g>
  <text x="200" y="254" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">
    Fotografía técnica en verificación
  </text>
</svg>
