server:
  port: ${PORT:8080}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/}

spring:
  application:
    name: renta-herramientas-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:1129/renta_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:Renta2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      idle-timeout: 30000
      pool-name: RentaHikariPool
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/

jwt:
  secret: ${JWT_SECRET:${APP_SECURITY_JWT_SECRET:RentaHerramientasClaveSuperSeguraJWT2026ConMasDe256BitsParaHS256Firmado!}}
  expiration-millis: ${JWT_EXPIRATION_MILLIS:43200000} # 12 horas para mayor seguridad

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: alpha
    tagsSorter: alpha
    tryItOutEnabled: true

# ==============================================================================
# CONFIGURACIÓN DE SPRING BOOT ACTUATOR (OBSERVABILIDAD Y MONITOREO)
# ==============================================================================
# Expone endpoints para verificar la salud del sistema y métricas de rendimiento:
# - /actuator/health: Indica si el servidor y la base de datos PostgreSQL están UP.
# - /actuator/info: Información de la versión y entorno de la aplicación.
# - /actuator/metrics: Estadísticas de memoria RAM (JVM), hilos y pool HikariCP.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

